[package]
name = "trains-desktop"
version = "1.10.1"
edition = "2024"
rust-version = "1.95"

[features]
custom-protocol = ["tauri/custom-protocol"]
ui-qa = ["trains-com-downloader/desktop-smoke"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["time"] }
rfd = "=0.17.2"
trains-com-downloader = { path = "../../rust-ui" }
