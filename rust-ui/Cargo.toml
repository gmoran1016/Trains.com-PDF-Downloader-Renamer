[package]
name = "trains-com-downloader"
version = "2.0.1"
edition = "2024"
rust-version = "1.95"

[lib]
name = "trains_com_downloader"
path = "src/lib.rs"

[features]
default = []
desktop-smoke = []
test-worker = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[[bin]]
name = "fake_worker"
path = "tests/fixtures/fake_worker.rs"
required-features = ["test-worker"]
test = false

[[test]]
name = "worker_tests"
path = "tests/worker_tests.rs"
required-features = ["test-worker"]
