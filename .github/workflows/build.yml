name: Build Desktop Applications

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo-target

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x86_64
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            architecture: x86_64
            bundles: appimage
          - os: macos-latest
            platform: macos
            architecture: aarch64
            bundles: app,dmg
          - os: macos-15-intel
            platform: macos
            architecture: x86_64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 \
            libdbus-1-dev libxcb-xinerama0 libxcb-cursor0 libxcb1 libx11-xcb1 \
            libxkbcommon-x11-0 libgl1 libegl1
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: desktop-ui
        run: npm ci
      - name: Verify all release versions
        run: python scripts/check_app_versions.py
      - name: Run Python engine and worker tests
        run: python -m pytest tests/ -q
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path rust-ui/Cargo.toml -- --check
          cargo fmt --manifest-path desktop-ui/src-tauri/Cargo.toml -- --check
      - name: Run Rust controller and worker tests
        run: cargo test --locked --manifest-path rust-ui/Cargo.toml --all-targets --features "test-worker desktop-smoke"
      - name: Check Rust controller
        run: cargo clippy --locked --manifest-path rust-ui/Cargo.toml --all-targets --features "test-worker desktop-smoke" -- -D warnings
      - name: Build frontend
        working-directory: desktop-ui
        run: npm run build
      - name: Install rendered-test browser
        working-directory: desktop-ui
        run: npx playwright install --with-deps chromium
      - name: Run rendered interface and interaction tests
        working-directory: desktop-ui
        run: npm test
      - name: Run desktop shell tests
        run: cargo test --locked --manifest-path desktop-ui/src-tauri/Cargo.toml
      - name: Check desktop shell
        run: cargo clippy --locked --manifest-path desktop-ui/src-tauri/Cargo.toml --all-targets --features ui-qa -- -D warnings
      - name: Build bundled Python worker
        shell: bash
        run: >-
          python -m PyInstaller --noconfirm --onefile --console
          --name TrainsDownloaderWorker
          --distpath build/pyinstaller-dist --workpath build/pyinstaller-work
          --specpath build/pyinstaller-spec
          --collect-all PyQt5 --collect-all selenium --collect-all pypdf
          --hidden-import requests --hidden-import trains_app worker_main.py
      - name: Set bundled worker path
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          worker = Path('build/pyinstaller-dist') / ('TrainsDownloaderWorker.exe' if sys.platform == 'win32' else 'TrainsDownloaderWorker')
          if not worker.is_file() or not worker.stat().st_size:
              raise SystemExit('The bundled worker was not produced.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'TRAINSDOWNLOADER_WORKER={worker.resolve()}\n')
          PY
      - name: Smoke-test packaged Python worker
        run: python scripts/smoke_test_worker.py
      - name: Build desktop packages
        working-directory: desktop-ui
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Windows portable executable
        if: runner.os == 'Windows'
        working-directory: desktop-ui
        run: npm run tauri -- build --no-bundle --features portable
      - name: Collect release packages
        shell: bash
        run: python scripts/collect_desktop_packages.py --platform ${{ matrix.platform }} --architecture ${{ matrix.architecture }} --target-dir build/cargo-target --output-dir dist/release
      - name: Verify isolated Windows startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-desktop-release.ps1 -ExecutablePath dist/release/TrainsDownloader-windows.exe
      - name: Save platform packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            dist/release/TrainsDownloader-*
            dist/release/update-architecture-${{ matrix.platform }}-${{ matrix.architecture }}.json
          if-no-files-found: error
      - name: Save rendered-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence-${{ matrix.platform }}-${{ matrix.architecture }}
          path: desktop-ui/test-results/
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - name: Read release version
        id: version
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('desktop-ui/package.json').read_text())['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Build signed update manifest
        run: >-
          python scripts/build_update_manifest.py
          --release-dir dist/release
          --version "${{ steps.version.outputs.version }}"
          --repository "${{ github.repository }}"
          --notes-file "docs/releases/v${{ steps.version.outputs.version }}.md"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/release/TrainsDownloader-*
            dist/release/latest.json
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
