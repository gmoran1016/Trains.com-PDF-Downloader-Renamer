name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update releases

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium PyQt5 requests beautifulsoup4 pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "TrainsDownloader" `
            --collect-all PyQt5 `
            --collect-all selenium `
            --hidden-import requests `
            --hidden-import bs4 `
            trains_app.py

      - name: Zip output
        run: Compress-Archive -Path dist\TrainsDownloader.exe -DestinationPath TrainsDownloader-windows.zip

      - name: Publish to GitHub Releases (rolling "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: TrainsDownloader-windows.zip
          body: |
            Automatically built from the latest commit on `main`.
            Download **TrainsDownloader-windows.zip**, extract it, and run `TrainsDownloader.exe`.
            Chrome must be installed — ChromeDriver downloads automatically on first run.
