name: Build Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TrainsDownloader-windows.exe
            dist_path: dist\TrainsDownloader.exe
          - os: ubuntu-latest
            artifact: TrainsDownloader-linux
            dist_path: dist/TrainsDownloader
          - os: macos-latest
            artifact: TrainsDownloader-macos
            dist_path: dist/TrainsDownloader

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxcb1 \
            libx11-xcb1 libgl1 libegl1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: >
          python -m PyInstaller
          --noconfirm
          --onefile
          --windowed
          --name TrainsDownloader
          --collect-all PyQt5
          --collect-all selenium
          --collect-all pypdf
          --hidden-import requests
          --hidden-import bs4
          trains_app.py

      - name: Rename executable
        shell: bash
        run: cp "${{ matrix.dist_path }}" "${{ matrix.artifact }}"

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('trains_app.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: false
          files: ${{ matrix.artifact }}
          body: |
            Automatically built from the latest commit on `main`.

            | Platform | Download |
            |----------|----------|
            | Windows  | `TrainsDownloader-windows.exe` → run directly |
            | Linux    | `TrainsDownloader-linux` → `chmod +x TrainsDownloader-linux` → run |
            | macOS    | `TrainsDownloader-macos` → run directly |

            **Requirement:** Chrome must be installed. ChromeDriver downloads automatically on first run.
