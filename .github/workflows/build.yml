name: Build Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TrainsDownloader-windows.zip
          - os: ubuntu-latest
            artifact: TrainsDownloader-linux.zip
          - os: macos-latest
            artifact: TrainsDownloader-macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxcb1 \
            libx11-xcb1 libgl1 libegl1 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium PyQt5 requests beautifulsoup4 pyinstaller

      - name: Build with PyInstaller
        run: >
          python -m PyInstaller
          --noconfirm
          --onefile
          --windowed
          --name TrainsDownloader
          --collect-all PyQt5
          --collect-all selenium
          --hidden-import requests
          --hidden-import bs4
          trains_app.py

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\TrainsDownloader.exe -DestinationPath ${{ matrix.artifact }}

      - name: Zip (Linux / macOS)
        if: runner.os != 'Windows'
        run: zip ${{ matrix.artifact }} dist/TrainsDownloader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: |
            TrainsDownloader-windows.zip
            TrainsDownloader-linux.zip
            TrainsDownloader-macos.zip
          body: |
            Automatically built from the latest commit on `main`.

            | Platform | Download |
            |----------|----------|
            | Windows  | `TrainsDownloader-windows.zip` → extract → run `TrainsDownloader.exe` |
            | Linux    | `TrainsDownloader-linux.zip` → extract → `chmod +x TrainsDownloader` → run |
            | macOS    | `TrainsDownloader-macos.zip` → extract → run `TrainsDownloader` |

            **Requirement:** Chrome must be installed. ChromeDriver downloads automatically on first run.
