name: Build Desktop Applications

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TARGET_DIR: build/cargo-target

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TrainsDownloader-windows.exe
            cargo_binary: build/cargo-target/release/trains-com-downloader.exe
          - os: ubuntu-latest
            artifact: TrainsDownloader-linux
            cargo_binary: build/cargo-target/release/trains-com-downloader
          - os: macos-latest
            artifact: TrainsDownloader-macos
            cargo_binary: build/cargo-target/release/trains-com-downloader

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config libdbus-1-dev libdbus-1-3 \
            libxcb-xinerama0 libxcb-cursor0 libxcb1 libx11-xcb1 \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Verify release versions match
        run: python scripts/check_app_versions.py

      - name: Run Python engine and worker tests
        run: python -m pytest tests/test_trains_app.py tests/test_worker_protocol.py tests/test_worker_integration.py -q

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-ui/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path rust-ui/Cargo.toml --all-targets --features "test-worker desktop-smoke"

      - name: Run Rust lint checks
        run: cargo clippy --manifest-path rust-ui/Cargo.toml --all-targets --features "test-worker desktop-smoke" -- -D warnings

      - name: Prepare isolated package directories
        shell: bash
        run: mkdir -p build/pyinstaller-work build/pyinstaller-dist build/pyinstaller-spec

      - name: Build bundled Python worker
        shell: bash
        run: >-
          python -m PyInstaller --noconfirm --onefile --console
          --name TrainsDownloaderWorker
          --distpath build/pyinstaller-dist
          --workpath build/pyinstaller-work
          --specpath build/pyinstaller-spec
          --collect-all PyQt5 --collect-all selenium --collect-all pypdf
          --hidden-import requests --hidden-import trains_app
          worker_main.py

      - name: Set bundled worker path
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys

          worker = Path("build/pyinstaller-dist") / ("TrainsDownloaderWorker.exe" if sys.platform == "win32" else "TrainsDownloaderWorker")
          if not worker.is_file() or worker.stat().st_size == 0:
              raise SystemExit(f"Worker package was not produced: {worker}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"TRAINSDOWNLOADER_WORKER={worker.resolve()}\n")
          PY

      - name: Smoke-test packaged Python worker
        run: python scripts/smoke_test_worker.py

      - name: Build Rust desktop application
        run: cargo build --manifest-path rust-ui/Cargo.toml --release

      - name: Copy release application
        shell: bash
        run: python -c "import shutil; shutil.copy2('${{ matrix.cargo_binary }}', '${{ matrix.artifact }}')"

      - name: Mark Unix application executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "${{ matrix.artifact }}"

      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("rust-ui/Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: false
          files: ${{ matrix.artifact }}
          body: |
            Automatically built from the latest commit on `main`.

            | Platform | Download |
            |----------|----------|
            | Windows  | `TrainsDownloader-windows.exe` → run directly |
            | Linux    | `TrainsDownloader-linux` → `chmod +x TrainsDownloader-linux` → run |
            | macOS    | `TrainsDownloader-macos` → run directly |

            **Requirement:** Chrome must be installed. ChromeDriver downloads automatically on first run.
